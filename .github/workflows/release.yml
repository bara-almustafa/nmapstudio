name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}      # allow manual test builds

permissions:
  contents: write            # needed to create the GitHub Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive: tar
          - os: macos-latest
            name: macos-universal
            archive: tar
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - os: windows-latest
            name: windows-x86_64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release -j

      # ---- stage the self-contained binary + docs ----
      - name: Stage (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp build/nmapstudio dist/
          cp README.md dist/
          chmod +x dist/nmapstudio
          file dist/nmapstudio || true

      - name: Stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/nmapstudio.exe dist/
          Copy-Item README.md dist/

      # ---- package ----
      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: tar -C dist -czf nmapstudio-${{ github.ref_name }}-${{ matrix.name }}.tar.gz .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath nmapstudio-${{ github.ref_name }}-${{ matrix.name }}.zip

      # ---- make the artifact available for manual (non-tag) runs ----
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmapstudio-${{ matrix.name }}
          path: nmapstudio-*-${{ matrix.name }}.*

      # ---- attach to the GitHub Release (tag pushes only) ----
      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nmapstudio-${{ github.ref_name }}-${{ matrix.name }}.*
          generate_release_notes: true
          fail_on_unmatched_files: true
