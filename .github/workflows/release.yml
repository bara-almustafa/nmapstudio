name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write            # needed to create the tag + GitHub Release

env:
  # tag on a tag-push, or the chosen input on a manual run
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive: tar
          - os: macos-latest
            name: macos-universal
            archive: tar
            cmake_extra: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - os: windows-latest
            name: windows-x86_64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Stage (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp build/nmapstudio dist/
          cp README.md dist/
          chmod +x dist/nmapstudio
          file dist/nmapstudio || true

      - name: Stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Release/nmapstudio.exe dist/
          Copy-Item README.md dist/

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        run: tar -C dist -czf nmapstudio-${VERSION}-${{ matrix.name }}.tar.gz .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "nmapstudio-$env:VERSION-${{ matrix.name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nmapstudio-${{ matrix.name }}
          path: nmapstudio-*-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Nmap Studio ${{ env.VERSION }}
          files: artifacts/**
          generate_release_notes: true
          fail_on_unmatched_files: true
